<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>167 Bostäder sålda - Järna ---ort </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --sf-dark-green: #004732; /* SF Original Grön */
            --sf-blue: #0066ff;
            --sf-text: #1a1a1a;
            --sf-gray: #666666;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            color: var(--sf-text);
            background-color: #fff;
            -webkit-font-smoothing: antialiased;
        }

        .sf-green { color: var(--sf-dark-green); }
        .bg-sf-green { background-color: var(--sf-dark-green); }
        
        /* Specifik skugga och border som SF använder */
        .sf-card {
            border: 1px solid #e5e5e5;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .sf-card:hover {
            border-color: transparent;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        .breadcrumb-text { font-size: 11px; letter-spacing: 0.05em; font-weight: 600; }
        .label-caps { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: #999; }
    </style>
</head>
<body>

<!-- NAVIGATION / HEADER -->
<nav class="border-b sticky top-0 bg-white z-[100]">
  <div class="max-w-[1400px] mx-auto px-4 h-28 flex items-center">

    <img 
      src="https://i.imgur.com/Hk80X7R.png"
      alt="Logga"
      class="h-full w-full object-contain cursor-pointer"
      onclick="showList()"
    >

  </div>
</nav>
<!-- HERO / BILDSEKTION -->
<div class="relative w-full h-[510px]">
  
  <img 
    src="https://i.imgur.com/qwgUtWO.png"
    class="w-full h-full object-cover"
    alt="Hero bild"
  >
     <!-- LISTVY -->
    <div id="listView" class="max-w-[1200px] mx-auto px-4 py-12">
        <div class="mb-10">
        </div> 
        <div id="propertyList" class="space-y-5">
            <!-- Renderas av JS -->
        </div>
    </div>

    <!-- DETALJVY -->
    <div id="detailView" class="hidden animate-in fade-in duration-500">
        <!-- Bild-grid i SF-stil -->
        <div class="flex gap-1 h-[400px] md:h-[600px] bg-gray-100 overflow-hidden">
            <div class="w-full md:w-1/2 h-full">
                <img id="detailImg1" src="" class="w-full h-full object-cover hover:opacity-95 transition">
            </div>
            <div class="hidden md:flex w-1/2 flex-col gap-1">
                <div class="h-1/2 w-full"><img id="detailImg2" src="" class="w-full h-full object-cover"></div>
                <div class="h-1/2 w-full relative">
                    <img id="detailImg3" src="" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/20 flex items-center justify-center">
                        <button class="bg-white text-black px-6 py-2 rounded-full font-bold text-sm">Visa alla bilder</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="max-w-[1200px] mx-auto px-4 py-12">
            <button onclick="showList()" class="flex items-center text-[12px] font-extrabold uppercase tracking-widest mb-10 hover:opacity-60">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M15 19l-7-7 7-7"/></svg> Tillbaka till sökresultat
            </button>

            <div class="flex flex-col lg:flex-row gap-16">
                <!-- Info -->
                <div class="lg:w-[65%]">
                    <div class="mb-12">
                        <span id="detailAreaTop" class="label-caps"></span>
                        <h1 id="detailAddress" class="text-[48px] font-extrabold leading-none mt-2 tracking-tighter"></h1>
                        
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-8 mt-12 pb-12 border-b">
                            <div><p class="label-caps mb-1">Slutpris</p><p id="detailPrice" class="text-3xl font-extrabold sf-green"></p></div>
                            <div><p class="label-caps mb-1">Boarea</p><p id="detailSize" class="text-3xl font-extrabold"></p></div>
                            <div><p class="label-caps mb-1">Rum</p><p id="detailRooms" class="text-3xl font-extrabold"></p></div>
                            <div><p class="label-caps mb-1">Tomt</p><p id="detailLot" class="text-3xl font-extrabold"></p></div>
                        </div>
                    </div>

                    <div class="mb-16">
                        <h2 class="text-2xl font-extrabold mb-6">Beskrivning</h2>
                        <p id="detailDesc" class="text-[#444] text-xl leading-relaxed font-normal"></p>
                    </div>

                    <div class="mb-20">
                        <h2 class="text-2xl font-extrabold mb-8">Fakta om bostaden</h2>
                        <div id="factTable" class="grid grid-cols-1 md:grid-cols-2 border-t border-gray-200">
                            <!-- JS rader -->
                        </div>
                    </div>
                </div>

                <!-- Sidebar -->
                <div class="lg:w-[35%]">
                    <div class="sticky top-32">
                        <div class="bg-[#f8f7f5] p-10 rounded-2xl">
                            <h3 class="text-xl font-extrabold mb-6">Värdera din egen bostad?</h3>
                            <p class="text-gray-600 mb-8 leading-relaxed">Ska du sälja? Våra mäklare i Järna har stenkoll på priserna just nu.</p>
                            <button class="w-full bg-sf-green text-white py-5 rounded-full font-extrabold tracking-widest text-[12px] uppercase mb-4 shadow-xl shadow-green-900/20">Boka fri värdering</button>
                        </div>
                        
                        <div class="mt-8 flex items-center p-6 border border-gray-100 rounded-2xl">
                            <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=150&h=150" class="w-16 h-16 rounded-full object-cover">
                            <div class="ml-4">
                                <p class="font-extrabold">Maria Fastighetsson</p>
                                <p class="text-sm text-gray-500 font-medium">Fastighetsmäklare Järna</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const properties = [
            { 
                id: 1, 
                address: "Kallfors Höjder 14", 
                area: "Järna - Kallfors", 
                price: "7 250 000 kr", 
                trend: "+12%", 
                rooms: "6 rum", 
                size: "165 m²", 
                lot: "1 240 m²", 
                soldDate: "2024-05-01", 
                isVarudeklarerat: true, 
                clickable: true,
                desc: "Drömmer du om ett modernt och bekymmersfritt boende? På exklusiva Kallfors Höjder hittar vi denna arkitektritade villa med slående utsikt och påkostade materialval. Stora fönsterpartier suddar ut gränsen mellan ute och inne.",
                facts: {"Byggår": "2021", "Upplåtelseform": "Äganderätt", "Driftkostnad": "3 200 kr/mån", "Energiklass": "B"}
            },
            { 
                id: 2, 
                address: "Storgatan 12A", 
                area: "Järna Centralt", 
                price: "2 150 000 kr", 
                trend: "±0%", 
                rooms: "3 rum", 
                size: "78 m²", 
                lot: "-", 
                soldDate: "2024-04-28", 
                isVarudeklarerat: false, 
                clickable: true,
                desc: "Välkommen till en av Järnas finaste treor! Här bor du mitt i byn med gångavstånd till precis allt. Lägenheten erbjuder renoverade ytskikt, ett modernt kök och en rymlig balkong.",
                facts: {"Våning": "2 av 3", "Månadsavgift": "4 250 kr", "Förening": "BRF Centrum", "Byggår": "1964"}
            },
            { 
                id: 3, 
                address: "Vattbrinksvägen 42", 
                area: "Järna - Vattbrink", 
                price: "4 800 000 kr", 
                trend: "+5%", 
                rooms: "5 rum", 
                size: "130 m²", 
                lot: "2 100 m²", 
                soldDate: "2024-04-15", 
                isVarudeklarerat: true, 
                clickable: true,
                desc: "En klassisk familjevilla på en fantastisk tomt! Här i Vattbrink bor ni lugnt och naturnära med skogen som granne. Perfekt disponerade ytor för den växande familjen.",
                facts: {"Typ": "1 ½-plansvilla", "Byggår": "1978", "Vatten/Avlopp": "Kommunalt", "Uppvärmning": "Luftvärmepump"}
            },
            { id: 4, address: "Mora Gårdsväg 7", area: "Järna - Mora", price: "3 200 000 kr", trend: "-2%", rooms: "3 rum", size: "65 m²", lot: "1 500 m²", soldDate: "2024-04-10", clickable: false },
            { id: 5, address: "Tavestavägen 21", area: "Järna - Tavesta", price: "6 100 000 kr", trend: "+15%", rooms: "7 rum", size: "185 m²", lot: "1 100 m²", soldDate: "2024-03-29", clickable: false },
            { id: 6, address: "Skillebyvret 2", area: "Järna - Skilleby", price: "5 350 000 kr", trend: "+2%", rooms: "5 rum", size: "140 m²", lot: "3 400 m²", soldDate: "2024-03-20", clickable: false },
            { id: 7, address: "Pilkrogsvägen 10", area: "Järna - Pilkrog", price: "3 650 000 kr", trend: "±0%", rooms: "4 rum", size: "112 m²", lot: "250 m²", soldDate: "2024-03-05", clickable: false },
            { id: 8, address: "Solåkrabyn 115", area: "Järna - Solåkra", price: "4 100 000 kr", trend: "+1%", rooms: "4 rum", size: "95 m²", lot: "800 m²", soldDate: "2024-02-22", clickable: false },
            { id: 9, address: "Nykvarnsvägen 55", area: "Järna Utkant", price: "5 900 000 kr", trend: "+8%", rooms: "6 rum", size: "155 m²", lot: "1 800 m²", soldDate: "2024-02-10", clickable: false },
            { id: 10, address: "Rönnvägen 8", area: "Järna Södra", price: "3 950 000 kr", trend: "+3%", rooms: "5 rum", size: "124 m²", lot: "300 m²", soldDate: "2024-01-30", clickable: false }
        ];

        function renderList() {
            const container = document.getElementById('propertyList');
            properties.forEach(p => {
                const isClickable = p.clickable;
                const trendColor = p.trend.includes('+') ? 'text-green-600' : p.trend.includes('-') ? 'text-red-500' : 'text-gray-400';
                
                container.innerHTML += `
                    <div ${isClickable ? `onclick="openDetail(${p.id})"` : ''} class="sf-card flex flex-col md:flex-row bg-white rounded-lg overflow-hidden ${isClickable ? 'cursor-pointer' : ''}">
                        <div class="md:w-[320px] h-[220px] relative shrink-0">
                            <img src="https://th.bing.com/th/id/OIP.g4NXKr_DvFOp6bmGt0e1owAAAA?w=194&h=291&c=7&r=0&o=5&dpr=1.5&pid=1.7" class="w-full h-full object-cover">
                            <div class="absolute bottom-4 left-4 bg-white px-2 py-1 rounded text-[10px] font-extrabold uppercase tracking-widest">Såld ${p.soldDate}</div>
                        </div>
                        <div class="p-8 flex-grow flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start">
                                    <span class="label-caps tracking-widest">${p.area}</span>
                                    ${p.isVarudeklarerat ? '<span class="bg-[#e6f0ff] text-[#0055ff] text-[9px] font-extrabold px-2 py-1 rounded">VARUDEKLARERAT</span>' : ''}
                                </div>
                                <h3 class="text-2xl font-extrabold mt-1 tracking-tight">${p.address}</h3>
                                <p class="text-gray-500 text-sm mt-1 font-medium">${p.rooms} • ${p.size}</p>
                            </div>
                            <div class="mt-4 flex items-end justify-between">
                                <div>
                                    <span class="label-caps mb-0.5 block">Slutpris</span>
                                    <div class="flex items-center">
                                        <span class="text-2xl font-extrabold sf-green">${p.price}</span>
                                        <span class="ml-3 text-xs font-bold ${trendColor}">${p.trend}</span>
                                    </div>
                                </div>
                                ${isClickable ? '<div class="text-gray-300 mr-2"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M9 5l7 7-7 7"/></svg></div>' : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function openDetail(id) {
            const p = properties.find(item => item.id === id);
            // Sätter specifika bilder för de 3 första för att skapa variation
            const imgSet = [
                "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80",
                "https://images.unsplash.com/photo-1600607687940-4e524cb35a3a?auto=format&fit=crop&w=1200&q=80",
                "https://images.unsplash.com/photo-1600566753190-17f0bb2a6c3e?auto=format&fit=crop&w=1200&q=80"
            ];

            document.getElementById('detailImg1').src = imgSet[0];
            document.getElementById('detailImg2').src = imgSet[1];
            document.getElementById('detailImg3').src = imgSet[2];
            document.getElementById('detailAreaTop').innerText = p.area;
            document.getElementById('detailAddress').innerText = p.address;
            document.getElementById('detailPrice').innerText = p.price;
            document.getElementById('detailRooms').innerText = p.rooms;
            document.getElementById('detailSize').innerText = p.size;
            document.getElementById('detailLot').innerText = p.lot;
            document.getElementById('detailDesc').innerText = p.desc;
            
            const table = document.getElementById('factTable');
            table.innerHTML = "";
            for (const [key, val] of Object.entries(p.facts)) {
                table.innerHTML += `
                    <div class="flex justify-between p-5 border-b border-gray-100">
                        <span class="text-gray-500 text-sm font-medium">${key}</span>
                        <span class="font-extrabold text-sm">${val}</span>
                    </div>`;
            }

            document.getElementById('listView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function showList() {
            document.getElementById('listView').classList.remove('hidden');
            document.getElementById('detailView').classList.add('hidden');
        }

        renderList();
    </script>
</body>
</html>
