<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slutpriser Järna - Bostadsförmedling</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        :root {
            --sf-green: #004732;
            --sf-text: #1a1a1a;
            --sf-gray: #666666;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--sf-text);
            background-color: #fff;
            -webkit-font-smoothing: antialiased;
        }

        .sf-green { color: var(--sf-green); }
        .bg-sf-green { background-color: var(--sf-green); }

        .sf-card {
            border: 1px solid #e5e5e5;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .sf-card:hover {
            border-color: transparent;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        .label-caps {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #999;
        }
    </style>
</head>

<body>

<!-- NAVIGATION (FIXAD SF-LAYOUT) -->
<nav class="border-b sticky top-0 bg-white z-[100]">
  <div class="max-w-[1200px] mx-auto px-4 h-20 flex items-center">

    <!-- LOGGA (VÄNSTER) -->
    <div class="flex items-center">
      <img 
        src="https://fkexternalwebsmediaprod.blob.core.windows.net/cache/4/e/9/b/9/c/4e9b9c318194176dc8cbb37ca7c258393b2d0132.jpg"
        class="h-10 w-auto cursor-pointer"
        onclick="showList()"
        alt="Logga"
      >
    </div>

    <!-- MENY (CENTER) -->
    <div class="flex-1 flex justify-center">
      <div class="hidden md:flex space-x-10">
        <a href="#" class="text-[13px] font-bold uppercase tracking-widest hover:text-[#004732]">Köpa</a>
        <a href="#" class="text-[13px] font-bold uppercase tracking-widest hover:text-[#004732]">Sälja</a>
        <a href="#" class="text-[13px] font-bold uppercase tracking-widest hover:text-[#004732]">Värdera</a>
      </div>
    </div>

    <!-- KNAPP (HÖGER) -->
    <div>
      <button class="bg-[#004732] text-white px-8 py-3 rounded-full text-[12px] font-bold uppercase tracking-wider hover:opacity-90 transition">
        Logga in
      </button>
    </div>

  </div>
</nav>

<!-- LISTVY -->
<div id="listView" class="max-w-[1200px] mx-auto px-4 py-12">
    <div class="mb-10">
        <nav class="label-caps text-gray-400 mb-4">Sverige / Stockholm / Södertälje / Järna</nav>
        <h1 class="text-[40px] font-extrabold">Slutpriser i Järna</h1>
        <p class="text-gray-500 text-lg mt-2">
            Här ser du de senaste försäljningarna av villor, lägenheter och radhus.
        </p>
    </div>

    <div id="propertyList" class="space-y-5"></div>
</div>

<!-- DETALJVY -->
<div id="detailView" class="hidden">

    <div class="max-w-[1200px] mx-auto px-4 py-12">
        <button onclick="showList()" class="mb-8 font-bold uppercase text-sm tracking-widest">
            ← Tillbaka
        </button>

        <h1 id="detailAddress" class="text-4xl font-extrabold mb-4"></h1>
        <p id="detailPrice" class="text-2xl font-bold sf-green mb-6"></p>

        <p id="detailDesc" class="text-lg text-gray-700"></p>
    </div>

</div>

<script>
const properties = [
    { id: 1, address: "Kallfors Höjder 14", area: "Järna", price: "7 250 000 kr", rooms: "6 rum", size: "165 m²", lot: "1240 m²", desc: "Modern villa med utsikt." },
    { id: 2, address: "Storgatan 12A", area: "Järna", price: "2 150 000 kr", rooms: "3 rum", size: "78 m²", lot: "-", desc: "Centralt läge." }
];

function renderList() {
    const container = document.getElementById("propertyList");

    properties.forEach(p => {
        container.innerHTML += `
        <div class="sf-card p-6 cursor-pointer" onclick="openDetail(${p.id})">
            <div class="text-sm text-gray-500">${p.area}</div>
            <div class="text-xl font-bold">${p.address}</div>
            <div class="mt-2">${p.rooms} • ${p.size}</div>
            <div class="mt-2 font-bold sf-green">${p.price}</div>
        </div>`;
    });
}

function openDetail(id) {
    const p = properties.find(x => x.id === id);

    document.getElementById("listView").classList.add("hidden");
    document.getElementById("detailView").classList.remove("hidden");

    document.getElementById("detailAddress").innerText = p.address;
    document.getElementById("detailPrice").innerText = p.price;
    document.getElementById("detailDesc").innerText = p.desc;
}

function showList() {
    document.getElementById("listView").classList.remove("hidden");
    document.getElementById("detailView").classList.add("hidden");
}

renderList();
</script>

</body>
</html>
